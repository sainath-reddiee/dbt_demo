checks for company_hierarchy:
  - row_count > 0:
      name: 'The mart must not be empty after the load.'
  - schema:
      fail:
        when required column missing: [COMPANY_HIERARCHY_HKEY, COMPANY_HIERARCHY_SKEY, GDP_INSERTED_BY, GDP_INSERTED_TS, GDP_IS_ACTIVE, GDP_UPDATED_BY, GDP_UPDATED_TS, REF_GDP_SOURCE_SYSTEM_SKEY, SOURCE_UNIQUE_ID]
        when wrong column type:
          COMPANY_CORE_SKEY: NUMBER(38,0)
          COMPANY_HIERARCHY_HKEY: TEXT
          COMPANY_HIERARCHY_SKEY: NUMBER(38,0)
          COMPANY_NAME: TEXT
          DOMESTIC_PARENT_SKEY: NUMBER(38,0)
          GDP_INSERTED_BY: TEXT
          GDP_INSERTED_TS: TEXT
          GDP_IS_ACTIVE: TEXT
          GDP_UPDATED_BY: TEXT
          GDP_UPDATED_TS: TEXT
          GLOBAL_PARENT_SKEY: NUMBER(38,0)
          HIERARCHY_LEVEL: NUMBER(10,0)
      name: 'Required STTM columns must be present on the dataset.'
  - duplicate_count(SOURCE_UNIQUE_ID, REF_GDP_SOURCE_SYSTEM_SKEY) = 0:
      name: 'Business key of the dimension must be unique.'
  - missing_count(SOURCE_UNIQUE_ID) = 0:
      name: 'Business key cannot be missing.'
  - missing_count(REF_GDP_SOURCE_SYSTEM_SKEY) = 0:
      name: 'Business key cannot be missing.'
  - missing_count(COMPANY_HIERARCHY_HKEY) = 0:
      name: 'COMPANY_HIERARCHY_HKEY is required by the STTM.'
  - missing_count(COMPANY_HIERARCHY_SKEY) = 0:
      name: 'COMPANY_HIERARCHY_SKEY is required by the STTM.'
  - missing_count(GDP_INSERTED_BY) = 0:
      name: 'GDP_INSERTED_BY is required by the STTM.'
  - freshness(GDP_INSERTED_BY):
      name: 'GDP_INSERTED_BY should be fresher than one day.'
      warn: when > 1d
  - missing_count(GDP_INSERTED_TS) = 0:
      name: 'GDP_INSERTED_TS is required by the STTM.'
  - freshness(GDP_INSERTED_TS):
      name: 'GDP_INSERTED_TS should be fresher than one day.'
      warn: when > 1d
  - missing_count(GDP_IS_ACTIVE) = 0:
      name: 'GDP_IS_ACTIVE is required by the STTM.'
  - freshness(GDP_IS_ACTIVE):
      name: 'GDP_IS_ACTIVE should be fresher than one day.'
      warn: when > 1d
  - missing_count(GDP_UPDATED_BY) = 0:
      name: 'GDP_UPDATED_BY is required by the STTM.'
  - freshness(GDP_UPDATED_BY):
      name: 'GDP_UPDATED_BY should be fresher than one day.'
      warn: when > 1d
  - missing_count(GDP_UPDATED_TS) = 0:
      name: 'GDP_UPDATED_TS is required by the STTM.'
  - freshness(GDP_UPDATED_TS):
      name: 'GDP_UPDATED_TS should be fresher than one day.'
      warn: when > 1d
  - missing_count(COMPANY_NAME):
      name: 'COMPANY_NAME had no missing values in the profiled source.'
      warn: when > 0
  - missing_count(REF_COMPANY_TYPE_SKEY):
      name: 'REF_COMPANY_TYPE_SKEY had no missing values in the profiled source.'
      warn: when > 0
  - invalid_count(REF_COMPANY_TYPE_SKEY):
      valid min: 0
      name: 'REF_COMPANY_TYPE_SKEY should not be negative.'
      warn: when > 0
  - invalid_percent(SOURCE_UNIQUE_ID):
      valid regex: '^[A-Z]{2}[0-9]{6}$'
      name: 'SOURCE_UNIQUE_ID should keep the shape AA999999.'
      warn: when > 5%
  - values in (COMPANY_CORE_SKEY) must exist in company_core (COMPANY_CORE_SKEY):
      name: 'Every COMPANY_CORE_SKEY must resolve to a COMPANY_CORE row.'
