checks for property_address:
  - row_count > 0:
      name: 'The mart must not be empty after the load.'
  - schema:
      fail:
        when required column missing: [GDP_INSERTED_BY, GDP_INSERTED_TS, GDP_UPDATED_TS, PROPERTY_ADDRESS_HKEY, PROPERTY_ADDRESS_SKEY, PROPERTY_CORE_SKEY]
        when wrong column type:
          ADDRESS_LINE_1: TEXT
          ADDRESS_LINE_2: TEXT
          ADDRESS_MATCH_CODE: TEXT
          ADDRESS_MATCH_SCORE: NUMBER(38,2)
          ADDRESS_PRECISION_CODE: TEXT
          CITY: TEXT
          COUNTRY: TEXT
          COUNTRY_ISO2_CODE: TEXT
          COUNTRY_ISO3_CODE: TEXT
          COUNTY: TEXT
          GDP_INSERTED_BY: TEXT
          GDP_INSERTED_TS: TIMESTAMP_NTZ
      name: 'Required STTM columns must be present on the dataset.'
  - duplicate_count(SOURCE_UNIQUE_ID, REF_GDP_SOURCE_SYSTEM_SKEY) = 0:
      name: 'Business key of the dimension must be unique.'
  - missing_count(SOURCE_UNIQUE_ID) = 0:
      name: 'Business key cannot be missing.'
  - missing_count(REF_GDP_SOURCE_SYSTEM_SKEY) = 0:
      name: 'Business key cannot be missing.'
  - missing_count(GDP_INSERTED_BY) = 0:
      name: 'GDP_INSERTED_BY is required by the STTM.'
  - freshness(GDP_INSERTED_BY):
      name: 'GDP_INSERTED_BY should be fresher than one day.'
      warn: when > 1d
  - missing_count(GDP_INSERTED_TS) = 0:
      name: 'GDP_INSERTED_TS is required by the STTM.'
  - freshness(GDP_INSERTED_TS):
      name: 'GDP_INSERTED_TS should be fresher than one day.'
      warn: when > 1d
  - freshness(GDP_IS_ACTIVE):
      name: 'GDP_IS_ACTIVE should be fresher than one day.'
      warn: when > 1d
  - freshness(GDP_UPDATED_BY):
      name: 'GDP_UPDATED_BY should be fresher than one day.'
      warn: when > 1d
  - missing_count(GDP_UPDATED_TS) = 0:
      name: 'GDP_UPDATED_TS is required by the STTM.'
  - freshness(GDP_UPDATED_TS):
      name: 'GDP_UPDATED_TS should be fresher than one day.'
      warn: when > 1d
  - missing_count(PROPERTY_ADDRESS_HKEY) = 0:
      name: 'PROPERTY_ADDRESS_HKEY is required by the STTM.'
  - missing_count(PROPERTY_ADDRESS_SKEY) = 0:
      name: 'PROPERTY_ADDRESS_SKEY is required by the STTM.'
  - missing_count(PROPERTY_CORE_SKEY) = 0:
      name: 'PROPERTY_CORE_SKEY is required by the STTM.'
  - missing_count(ADDRESS_PRECISION_CODE):
      name: 'ADDRESS_PRECISION_CODE had no missing values in the profiled source.'
      warn: when > 0
  - invalid_count(ADDRESS_PRECISION_CODE):
      valid values: ['ROOFTOP', 'PARCEL']
      name: 'ADDRESS_PRECISION_CODE should stay within the 2 observed codes.'
      warn: when > 0
  - missing_count(GEOMETRY):
      name: 'GEOMETRY had no missing values in the profiled source.'
      warn: when > 0
  - invalid_percent(GEOMETRY):
      valid regex: '^[A-Z]{5}\(\-[0-9]{3}\.[0-9]{2}\ [0-9]{2}\.[0-9]{2}\)$'
      name: 'GEOMETRY should keep the shape AAAAA(-999.99 99.99).'
      warn: when > 5%
  - missing_count(SOURCE_ADDRESS_LINE_1):
      name: 'SOURCE_ADDRESS_LINE_1 had no missing values in the profiled source.'
      warn: when > 0
  - invalid_percent(SOURCE_UNIQUE_ID):
      valid regex: '^[A-Z]{2}[0-9]{3}$'
      name: 'SOURCE_UNIQUE_ID should keep the shape AA999.'
      warn: when > 5%
  - missing_count(STREET_TYPE):
      name: 'STREET_TYPE had no missing values in the profiled source.'
      warn: when > 0
  - values in (PROPERTY_CORE_SKEY) must exist in property_core (PROPERTY_CORE_SKEY):
      name: 'Every PROPERTY_CORE_SKEY must resolve to a PROPERTY_CORE row.'
