          COMPANY_CORE_SKEY: NUMBER(38,0)
          COMPANY_SEGMENT_HKEY: TEXT
          COMPANY_SEGMENT_SKEY: NUMBER(38,0)
          GDP_INSERTED_BY: TEXT
          GDP_INSERTED_TS: TIMESTAMP_NTZ(6)
          GDP_IS_ACTIVE: BOOLEAN
          GDP_UPDATED_BY: TEXT
          GDP_UPDATED_TS: TIMESTAMP_NTZ(6)
          REF_GDP_SOURCE_SYSTEM_SKEY: NUMBER(38,0)
          REF_SEGMENT_SKEY: NUMBER(38,0)
          REF_SERVICE_LINE_SKEY: NUMBER(38,0)
