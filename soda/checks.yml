checks for company_segment:
  - row_count > 0:
      name: 'The mart must not be empty after the load.'
  - schema:
      fail:
        when required column missing: [COMPANY_SEGMENT_HKEY, COMPANY_SEGMENT_SKEY, GDP_INSERTED_BY, GDP_INSERTED_TS, GDP_IS_ACTIVE, GDP_UPDATED_BY, GDP_UPDATED_TS, REF_GDP_SOURCE_SYSTEM_SKEY, SOURCE_UNIQUE_ID]
