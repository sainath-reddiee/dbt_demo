checks for company_relationship:
  - row_count > 0:
      name: 'The mart must not be empty after the load.'
  - schema:
      fail:
        when required column missing: [COMPANY_RELATIONSHIP_HKEY, COMPANY_RELATIONSHIP_SKEY, GDP_INSERTED_BY, GDP_INSERTED_TS, GDP_IS_ACTIVE, GDP_UPDATED_BY, GDP_UPDATED_TS, REF_GDP_SOURCE_SYSTEM_SKEY, SOURCE_UNIQUE_ID]
        when wrong column type:
          ACCOUNT_NAME: TEXT
          ACCOUNT_NUMBER: NUMBER(38,0)
          ACCOUNT_STATUS: TEXT
          COMPANY_CORE_SKEY: NUMBER(38,0)
          COMPANY_RELATIONSHIP_HKEY: TEXT
          COMPANY_RELATIONSHIP_SKEY: NUMBER(38,0)
          GDP_INSERTED_BY: TEXT
          GDP_INSERTED_TS: TIMESTAMP_NTZ(6)
          GDP_IS_ACTIVE: BOOLEAN
          GDP_UPDATED_BY: TEXT
          GDP_UPDATED_TS: TIMESTAMP_NTZ(6)
          REF_GDP_SOURCE_SYSTEM_SKEY: NUMBER(38,0)
      name: 'Required STTM columns must be present on the dataset.'
  - duplicate_count(SOURCE_UNIQUE_ID, REF_GDP_SOURCE_SYSTEM_SKEY) = 0:
      name: 'Business key of the dimension must be unique.'
  - missing_count(SOURCE_UNIQUE_ID) = 0:
      name: 'Business key cannot be missing.'
  - missing_count(REF_GDP_SOURCE_SYSTEM_SKEY) = 0:
      name: 'Business key cannot be missing.'
  - missing_count(COMPANY_RELATIONSHIP_HKEY) = 0:
      name: 'COMPANY_RELATIONSHIP_HKEY is required by the STTM.'
  - missing_count(COMPANY_RELATIONSHIP_SKEY) = 0:
      name: 'COMPANY_RELATIONSHIP_SKEY is required by the STTM.'
  - missing_count(GDP_INSERTED_BY) = 0:
      name: 'GDP_INSERTED_BY is required by the STTM.'
  - freshness(GDP_INSERTED_BY):
      name: 'GDP_INSERTED_BY should be fresher than one day.'
      warn: when > 1d
  - missing_count(GDP_INSERTED_TS) = 0:
      name: 'GDP_INSERTED_TS is required by the STTM.'
  - freshness(GDP_INSERTED_TS):
      name: 'GDP_INSERTED_TS should be fresher than one day.'
      warn: when > 1d
  - missing_count(GDP_IS_ACTIVE) = 0:
      name: 'GDP_IS_ACTIVE is required by the STTM.'
  - freshness(GDP_IS_ACTIVE):
      name: 'GDP_IS_ACTIVE should be fresher than one day.'
      warn: when > 1d
  - missing_count(GDP_UPDATED_BY) = 0:
      name: 'GDP_UPDATED_BY is required by the STTM.'
  - freshness(GDP_UPDATED_BY):
      name: 'GDP_UPDATED_BY should be fresher than one day.'
      warn: when > 1d
  - missing_count(GDP_UPDATED_TS) = 0:
      name: 'GDP_UPDATED_TS is required by the STTM.'
  - freshness(GDP_UPDATED_TS):
      name: 'GDP_UPDATED_TS should be fresher than one day.'
      warn: when > 1d
  - missing_count(ACCOUNT_NAME):
      name: 'ACCOUNT_NAME had no missing values in the profiled source.'
      warn: when > 0
  - missing_count(ACCOUNT_NUMBER):
      name: 'ACCOUNT_NUMBER had no missing values in the profiled source.'
      warn: when > 0
  - invalid_count(ACCOUNT_NUMBER):
      valid min: 0
      name: 'ACCOUNT_NUMBER should not be negative.'
      warn: when > 0
  - missing_count(REF_RELATIONSHIP_TYPE_SKEY):
      name: 'REF_RELATIONSHIP_TYPE_SKEY had no missing values in the profiled source.'
      warn: when > 0
  - invalid_count(REF_RELATIONSHIP_TYPE_SKEY):
      valid min: 0
      name: 'REF_RELATIONSHIP_TYPE_SKEY should not be negative.'
      warn: when > 0
  - missing_count(RELATIONSHIP_END_DATE):
      name: 'RELATIONSHIP_END_DATE had no missing values in the profiled source.'
      warn: when > 0
  - missing_count(RELATIONSHIP_START_DATE):
      name: 'RELATIONSHIP_START_DATE had no missing values in the profiled source.'
      warn: when > 0
  - invalid_count(RELATIONSHIP_START_DATE):
      valid values: ['2026-01-13 00:50:31.703', '2026-01-13 00:48:50.750']
      name: 'RELATIONSHIP_START_DATE should stay within the 2 observed codes.'
      warn: when > 0
  - invalid_percent(SOURCE_UNIQUE_ID):
      valid regex: '^[A-Z]{2}[0-9]{6}$'
      name: 'SOURCE_UNIQUE_ID should keep the shape AA999999.'
      warn: when > 5%
  - values in (COMPANY_CORE_SKEY) must exist in company_core (COMPANY_CORE_SKEY):
      name: 'Every COMPANY_CORE_SKEY must resolve to a COMPANY_CORE row.'
