version: 2

models:
  - name: company_relationship
    description: "one row per SOURCE_UNIQUE_ID per REF_GDP_SOURCE_SYSTEM_SKEY"
    columns:
      - name: source_unique_id
        description: "STTM business keys"
        tests:
          - not_null
          - unique
      - name: company_relationship_skey
        description: "sequence"
        tests:
          - not_null
      - name: ref_gdp_source_system_skey
        tests:
          - not_null
      - name: company_core_skey
        description: "FK"
      - name: ref_relationship_type_skey
      - name: account_name
      - name: account_number
      - name: account_status
      - name: source_account_id
      - name: relationship_start_date
      - name: relationship_end_date
      - name: company_relationship_hkey
        tests:
          - not_null
      - name: gdp_is_active
        tests:
          - not_null
      - name: gdp_inserted_ts
        tests:
          - not_null
      - name: gdp_inserted_by
        tests:
          - not_null
      - name: gdp_updated_ts
        tests:
          - not_null
      - name: gdp_updated_by
        tests:
          - not_null
