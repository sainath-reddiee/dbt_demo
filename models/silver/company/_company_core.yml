version: 2

models:
  - name: company_core
    description: "one row per SOURCE_UNIQUE_ID per REF_GDP_SOURCE_SYSTEM_SKEY"
    columns:
      - name: source_unique_id
        description: "STTM business keys"
        tests:
          - not_null
          - unique
      - name: company_core_skey
        description: "Sequence default"
        tests:
          - not_null
      - name: ref_gdp_source_system_skey
        description: "Cross join to ref_gdp_source_system"
        tests:
          - not_null
      - name: duns_number
      - name: company_name
        description: "DBA/trading name"
      - name: alias_name
        description: "CBRE internal alias"
      - name: ref_company_type_skey
        description: "LEFT JOIN ref_company_type"
      - name: ref_country_of_registration_skey
        description: "LEFT JOIN ref_country (via country_mapping)"
      - name: ref_address_skey
        description: "FK to SHARED.ADDRESS"
      - name: website_url
      - name: is_cbre_entity
        description: "Default `'N'`"
      - name: company_status
        description: "Active/Inactive/Dissolved/In Liquidation"
      - name: company_core_hkey
        description: "`m_company_core_hkey()`"
        tests:
          - not_null
      - name: gdp_is_active
        tests:
          - not_null
      - name: gdp_inserted_ts
        tests:
          - not_null
      - name: gdp_inserted_by
        tests:
          - not_null
      - name: gdp_updated_ts
        tests:
          - not_null
      - name: gdp_updated_by
        tests:
          - not_null
